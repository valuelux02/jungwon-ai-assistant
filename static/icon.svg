<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- App Icon Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-dasharray="16 12"/>
  
  <!-- Graduation Cap (Academic) -->
  <polygon points="256,120 400,190 256,260 112,190" fill="#ffffff" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.2))"/>
  <polygon points="170,225 170,300 256,340 342,300 342,225 256,265" fill="#e2e8f0"/>
  <!-- Tassel -->
  <path d="M380,200 L380,280 L395,285 L395,310 L370,310 L370,285 L380,280" fill="url(#goldGrad)"/>
  
  <!-- AI Sparkle / Robot Circuit Node -->
  <g transform="translate(256,380)">
    <circle cx="0" cy="0" r="32" fill="#10b981" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.25))"/>
    <path d="M-10,-10 L10,10 M-10,10 L10,-10" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff"/>
  </g>
  <line x1="256" y1="340" x2="256" y2="348" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
</svg>
